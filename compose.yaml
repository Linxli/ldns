# Docker Compose configuration for LDNS project
# Includes DNS server with REST API and Terminal UI for management

services:
  # DNS Server with REST API
  dns-server:
    build:
      context: ./dnsraw
      dockerfile: Dockerfile
    container_name: ldns-dns-server
    ports:
      - "53:53/udp"      # DNS queries port
      - "8080:8080/tcp"  # REST API port for configuration
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - UPSTREAM_DNS=1.1.1.1
      - RUST_LOG=info
    volumes:
      # Persist blocklist data
      - dns-data:/app/data
      # Mount blocklist file (optional - can be managed via API)
      - ./dnsblock.txt:/app/dnsblock.txt:ro
    networks:
      - ldns-network
    cap_add:
      # Required for binding to port 53 as non-root user
      - NET_BIND_SERVICE
    cap_drop:
      # Drop all other capabilities for security
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "com.ldns.service=dns-server"
      - "com.ldns.description=DNS server with blocklist support"

  # Terminal UI for DNS server management
  tui:
    build:
      context: ./ldnsTUI
      dockerfile: Dockerfile
    container_name: ldns-tui
    environment:
      - DNS_API_URL=http://dns-server:8080
      - RUST_LOG=info
    networks:
      - ldns-network
    depends_on:
      dns-server:
        condition: service_healthy
    # TUI requires interactive terminal - don't start automatically
    # Use: docker compose run --rm tui
    stdin_open: true
    tty: true
    profiles:
      - tools
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 64M
    labels:
      - "com.ldns.service=tui"
      - "com.ldns.description=Terminal UI for DNS server management"

# Define network for service communication
networks:
  ldns-network:
    driver: bridge
    name: ldns-network
    labels:
      - "com.ldns.network=main"

# Define volumes for data persistence
volumes:
  dns-data:
    name: ldns-dns-data
    labels:
      - "com.ldns.volume=dns-data"
      - "com.ldns.description=DNS server persistent data"
