[package]
name = "ldnsTUI"
version = "0.1.0"
edition = "2021"

[dependencies]
# TUI framework - the star of the show!
ratatui = "0.29"

# Terminal backend (handles raw terminal I/O)
crossterm = "0.28"

# HTTP client to talk to our DNS API
reqwest = { version = "0.11", features = ["json"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# JSON serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
